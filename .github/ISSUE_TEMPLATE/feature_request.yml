name: 功能建议
description: 描述一个使用场景，提出你希望的功能
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你遇到的是什么情况？现在的做法哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望的方案
      description: 你期望模组怎么表现？如果能用配置开关控制更好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 这个功能不需要玩家安装客户端模组
          required: true
